[package]
name = "sfconversions"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "geo-traits implementations for the R package {sf} and their corresponding geometries."
repository = "https://github.com/josiahparry/sfconversions"
keywords = ["geospatial", "rstats"]
categories = ["science::geo"]
authors = ["Josiah Parry <josiah@ricochet.rs>", "Kenneth Vernon <kenneth.b.vernon@gmail.com>"]

[features]
# rstar = ["dep:rstar"]

[lib]
crate-type = ["lib", "staticlib"]
doctest = false

[dependencies]
extendr-api = ">=0.9"
geo-traits = "0.3"
geo-types = ">=0.7"
rstar = { version = ">=0.11.0" }

[dev-dependencies]
extendr-engine = "0.9"
